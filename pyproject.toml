[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.sdist]
exclude = [
  "tests/",
]

[project]
name = "nfixplanet"
version = "0.1.3"
description = "Nitrogen Fixer detection pipeline"
authors = [{name = "Shahriyar Mahdi Robbani", email = "shahriyar.robbani@embl.de" }]
readme = "README.md"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
]
license = "MIT"
license-files = ["LICENSE"]

dependencies = [
    "pandas >=1.3, <2.2",
    "defopt<7"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]


[project.scripts]
nfixplanet = "nfixplanet.cli:main"

[tool.setuptools.package-data]
"nfixplanet" = ["reference_data/hmm_profiles/*", "reference_data/map/*"]

[project.urls]
Homepage = "https://github.com/grp-bork/nfixplanet"
Repository = "https://github.com/grp-bork/nfixplanet"
Issues = "https://github.com/grp-bork/nfixplanet/issues"
