[build-system]
requires = ["uv_build >= 0.8.17, <0.9.0"]
build-backend = "uv_build"

[project]
name = "nfixplanet"
version = "0.1.0"
description = "Nitrogen Fixer detection pipeline"
authors = [{name = "Shahriyar Mahdi Robbani", email = "" }]
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
]
license = "MIT"
license-files = ["LICEN[CS]E*"]

dependencies = [
    "pandas >=1.3, <2.2",
]


[project.scripts]
nfixplanet = "nfixplanet.cli:main"

[tool.setuptools.package-data]
"nfixplanet" = ["reference_data/hmm_profiles/*"]

